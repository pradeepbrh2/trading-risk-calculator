name: Generate social preview image

on:
  push:
    paths:
      - "assets/candle-catch-preview.svg"
      - ".github/workflows/generate-social-preview.yml"

permissions:
  contents: write

jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render SVG as PNG
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('assets/candle-catch-preview.svg').png().toFile('assets/candle-catch-preview.png')"
      - name: Commit PNG if changed
        run: |
          if [ -f assets/candle-catch-preview.png ] && git diff --quiet -- assets/candle-catch-preview.png; then
            echo "Preview PNG is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/candle-catch-preview.png
          git commit -m "Generate PNG social preview for Candle Catch"
          git push
